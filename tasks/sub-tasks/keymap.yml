---
- name: Configure console keymap
  become: true
  loop:
    - regexp: "^XKBMODEL="
      line: "XKBMODEL=pc105"
    - regexp: "^KEYMAP="
      line: "KEYMAP={{ locales_keymap }}"
    - regexp: "^XKBLAYOUT="
      line: "XKBLAYOUT={{ locales_keymap }}"
    # - regexp: "^KEYMAP_TOGGLE="
    #   line: "KEYMAP_TOGGLE={{ locales_keymap_toggle }}"
    #   state: "{{ locales_keymap_toggle is none | ternary('absent', 'present') }}"
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: "{{ item.state | default(omit) }}"
    create: true
    owner: root
    group: root
    mode: "0644"

- name: Run setupcon
  become: true
  ansible.builtin.command: setupcon
